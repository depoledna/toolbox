[project]
name = "mcp_toolbox"
version = "1.0.1"
description = "Hot-reloadable MCP toolbox for coding agents: REPL, sandboxed shell, browser, SSH, and pentest tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "python-dotenv",
    "paramiko>=3.4.0,<4",
    "requests",
    "playwright>=1.49.0",
    "stagehand",
]
